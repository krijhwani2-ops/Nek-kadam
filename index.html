<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nek Kadam</title>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="background:#0f172a;color:#f87171;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;text-align:center;">' +
            '<div style="background:#1e293b;padding:30px;border-radius:20px;max-width:500px;border:1px solid #334155;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">' +
            '<h2 style="margin-top:0;color:#f87171;">Startup Error</h2>' +
            '<p style="color:#cbd5e1;font-size:14px;word-break:break-word;">' + (e.message || 'Error initializing application') + '</p>' +
            '<button onclick="localStorage.clear();location.reload();" style="margin-top:15px;background:#10b981;color:white;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;cursor:pointer;">Reset Storage & Reload</button>' +
            '</div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
